<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 312" width="244" height="312" shape-rendering="crispEdges" role="img" aria-label="Scène de nuit en pixel-art : une tente éclairée sous un ciel étoilé, au bord d'un lac.">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1024"/>
      <stop offset=".45" stop-color="#132043"/>
      <stop offset=".72" stop-color="#24365e"/>
      <stop offset="1" stop-color="#3b4f72"/>
    </linearGradient>
    <linearGradient id="lac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2c4e"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <radialGradient id="lueur" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f0bf00" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#e08a2a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#e08a2a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="244" height="312" fill="url(#ciel)"/>

  <!-- étoiles -->
  <g fill="#f7f8f8">
    <rect x="18" y="22" width="2" height="2" opacity=".85"/><rect x="52" y="40" width="2" height="2" opacity=".5"/>
    <rect x="88" y="16" width="2" height="2" opacity=".7"/><rect x="128" y="34" width="2" height="2" opacity=".9"/>
    <rect x="164" y="20" width="2" height="2" opacity=".55"/><rect x="200" y="44" width="2" height="2" opacity=".8"/>
    <rect x="226" y="26" width="2" height="2" opacity=".6"/><rect x="34" y="66" width="2" height="2" opacity=".45"/>
    <rect x="72" y="74" width="2" height="2" opacity=".65"/><rect x="108" y="58" width="2" height="2" opacity=".4"/>
    <rect x="148" y="70" width="2" height="2" opacity=".75"/><rect x="186" y="62" width="2" height="2" opacity=".5"/>
    <rect x="214" y="80" width="2" height="2" opacity=".7"/><rect x="10" y="48" width="2" height="2" opacity=".55"/>
  </g>
  <!-- lune -->
  <g><circle cx="196" cy="52" r="13" fill="#f7f8f8" opacity=".16"/><circle cx="196" cy="52" r="8" fill="#f7f8f8" opacity=".92"/><circle cx="200" cy="49" r="7" fill="#132043" opacity=".55"/></g>

  <!-- montagnes lointaines -->
  <path d="M0 170 L38 132 L70 162 L104 124 L144 166 L180 138 L216 168 L244 148 L244 200 L0 200 Z" fill="#1b2746"/>
  <path d="M104 124 L120 144 L88 144 Z" fill="#2c3d63" opacity=".8"/>
  <path d="M38 132 L50 148 L26 148 Z" fill="#2c3d63" opacity=".6"/>

  <!-- forêt -->
  <g fill="#101a30">
    <path d="M6 196 L14 170 L22 196 Z"/><path d="M24 198 L33 166 L42 198 Z"/><path d="M44 196 L51 174 L58 196 Z"/>
    <path d="M186 197 L194 172 L202 197 Z"/><path d="M204 198 L213 168 L222 198 Z"/><path d="M224 196 L231 176 L238 196 Z"/>
  </g>

  <!-- lac -->
  <rect x="0" y="198" width="244" height="114" fill="url(#lac)"/>
  <g fill="#f7f8f8" opacity=".10">
    <rect x="30" y="216" width="34" height="2"/><rect x="150" y="228" width="46" height="2"/>
    <rect x="66" y="246" width="30" height="2"/><rect x="170" y="262" width="38" height="2"/>
    <rect x="24" y="278" width="42" height="2"/>
  </g>
  <!-- reflet de lune -->
  <g fill="#f7f8f8" opacity=".2"><rect x="190" y="210" width="12" height="2"/><rect x="192" y="222" width="8" height="2"/><rect x="189" y="236" width="14" height="2"/></g>

  <!-- rive -->
  <rect x="0" y="194" width="244" height="8" fill="#16203a"/>

  <!-- lueur du feu -->
  <ellipse cx="108" cy="182" rx="62" ry="34" fill="url(#lueur)"/>

  <!-- tente -->
  <path d="M60 190 L92 140 L124 190 Z" fill="#cfd6e0"/>
  <path d="M92 140 L124 190 L108 190 L92 152 Z" fill="#9aa5b8"/>
  <path d="M86 190 L92 166 L98 190 Z" fill="#2a1c12"/>
  <path d="M92 138 L94 130 L96 138 Z" fill="#8a8f98"/>
  <!-- lanterne -->
  <g><circle cx="118" cy="158" r="7" fill="#f0bf00" opacity=".25"/><rect x="116" y="155" width="5" height="6" fill="#f0bf00"/><rect x="117" y="150" width="3" height="5" fill="#6b5a38"/></g>

  <!-- feu de camp -->
  <g>
    <rect x="132" y="186" width="18" height="3" fill="#3a2a1c"/><rect x="136" y="182" width="12" height="3" fill="#4a3625"/>
    <rect x="138" y="176" width="6" height="7" fill="#f0bf00"/><rect x="140" y="170" width="3" height="7" fill="#ffd747"/>
    <rect x="137" y="179" width="2" height="4" fill="#e08a2a"/><rect x="144" y="180" width="2" height="4" fill="#e08a2a"/>
  </g>

  <!-- silhouette assise -->
  <g fill="#0d1220">
    <circle cx="166" cy="172" r="5"/><rect x="161" y="178" width="11" height="12"/><rect x="172" y="184" width="8" height="3"/>
  </g>
</svg>
